<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Clásico</title>
<style>
  :root{
    --desk:#008080; --face:#c0c0c0; --hi:#ffffff; --lo:#808080; --dark:#404040;
    --title:#000080; --text:#000; --log:#fff; --sys:#7a7a7a;
    --ui:Tahoma,"MS Sans Serif",Verdana,sans-serif;
    --mono:"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--desk);font:13px var(--ui);color:var(--text);display:flex;align-items:center;justify-content:center;padding:8px}
  .win{background:var(--face);border:2px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:1px 1px 0 #000;display:flex;flex-direction:column;width:min(980px,100%);height:min(680px,100%)}
  .bar{background:var(--title);color:#fff;font-weight:bold;padding:3px 6px;display:flex;justify-content:space-between;align-items:center;margin:2px}
  .bar small{font-weight:normal}
  .inset{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:var(--log)}
  button,input{font:inherit}
  button{background:var(--face);border:2px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);padding:3px 12px;cursor:pointer;color:#000}
  button:active{border-color:var(--dark) var(--hi) var(--hi) var(--dark);padding:4px 11px 2px 13px}
  button:focus-visible,input:focus-visible{outline:1px dotted #000;outline-offset:-4px}
  input[type=text]{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#fff;padding:3px 5px;min-width:0}
  .login{margin:auto;width:min(340px,92%)}
  .login .body{padding:14px;display:grid;gap:10px}
  .login label{display:grid;gap:4px}
  .hint{color:#333;font-size:12px;line-height:1.4}
  #app{display:none;flex:1;min-height:0;flex-direction:column;padding:4px;gap:4px}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:170px 1fr 150px;gap:4px}
  .col{display:flex;flex-direction:column;min-height:0;gap:4px}
  .col h3{margin:0;font-size:12px;padding:2px 4px}
  .list{flex:1;overflow:auto;padding:2px;font-family:var(--mono);font-size:13px}
  .list div{padding:1px 4px;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rooms div{cursor:pointer}
  #rooms div:hover{background:#dde}
  #rooms div.cur{background:var(--title);color:#fff}
  .join{display:flex;gap:4px}
  .join input{flex:1;width:100%}
  .opt{font-size:12px;display:flex;gap:4px;align-items:center}
  #log{flex:1;min-height:0;overflow:auto;padding:4px 6px;font:13px/1.45 var(--mono);overflow-wrap:anywhere}
  #log .t{color:var(--sys)}
  #log .s{color:var(--sys);font-style:italic}
  #log .me{color:#800080}
  #topic{padding:3px 6px;font-weight:bold}
  .send{display:flex;gap:4px}
  .send input{flex:1}
  .status{font-size:12px;padding:2px 4px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);display:flex;justify-content:space-between;gap:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10}
  @media (max-width:720px){
    body{padding:0}
    .win{height:100%}
    .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .side,.users{display:none}
    .side.open{display:flex}
    #menu{display:inline-block}
  }
  @media (min-width:721px){#menu{display:none}}
</style>
</head>
<body>

<div class="win" id="win">
  <div class="bar"><span>Chat Clásico</span><small id="who"></small></div>

  <!-- Lobby -->
  <div class="login" id="login">
    <div class="win" style="height:auto;width:100%;box-shadow:none">
      <div class="bar"><span>Lobby: salas creadas</span></div>
      <div class="body">
        <div>Toca una sala para entrar</div>
        <div class="inset list" id="rooms0" style="height:200px"></div>
        <div class="hint" id="lst"></div>
        <div style="display:flex;gap:4px">
          <input type="text" id="room0" maxlength="30" placeholder="Nombre de una sala nueva" autocomplete="off" style="flex:1">
          <button id="enter">Crear</button>
        </div>
        <div class="hint" id="exists"></div>
        <label class="opt"><input type="checkbox" id="hidden0"> Sala oculta (no aparece en la lista)</label>
        <div class="hint">Sin cuenta ni contraseña. Los mensajes no se guardan: solo los ven quienes están conectados.</div>
      </div>
    </div>
  </div>

  <!-- Pedir nombre -->
  <div class="modal" id="ask">
    <div class="win" style="height:auto;width:min(320px,92%)">
      <div class="bar"><span>¿Cómo te llamas?</span></div>
      <div class="login body" style="margin:0;width:auto;padding:14px;display:grid;gap:10px">
        <div>Vas a entrar a <b id="askroom"></b></div>
        <input type="text" id="nick" maxlength="20" placeholder="Tu nombre o alias" autocomplete="off">
        <div style="display:flex;gap:6px;justify-content:flex-end">
          <button id="askok">Entrar</button>
          <button id="askno" type="button">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div id="app">
    <div class="main">
      <div class="col side" id="side">
        <button id="back" type="button">← Volver al lobby</button>
        <h3>Salas</h3>
        <div class="inset list" id="rooms"></div>
        <div class="join">
          <input type="text" id="newroom" maxlength="30" placeholder="Nueva sala" autocomplete="off">
          <button id="go">Ir</button>
        </div>
        <div class="hint" id="exists2"></div>
        <label class="opt"><input type="checkbox" id="hidden"> Sala oculta (no aparece en la lista)</label>
      </div>
      <div class="col">
        <div class="inset" id="topic"></div>
        <div class="inset" id="log" aria-live="polite"></div>
      </div>
      <div class="col users">
        <h3>En la sala</h3>
        <div class="inset list" id="users"></div>
      </div>
    </div>
    <form class="send" id="form">
      <button type="button" id="menu">Salas</button>
      <input type="text" id="msg" maxlength="500" placeholder="Escribe un mensaje… (/ayuda para comandos)" autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
    <div class="status"><span id="st">Conectando…</span><span id="cnt"></span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="module">
/* ---- Configuración ---- */
const NS = 'chatclasico-v1';   // cambia esto para tener tu propia “red” de salas
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];  // brokers MQTT públicos (se usa el primero que conecte)
const TTL = 90000;             // ms sin señales de vida para dar a alguien por desconectado

const $ = id => document.getElementById(id);
const store = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} } };
const rnd = () => Math.random().toString(36).slice(2,10);
const ME = (() => { try{ let v = sessionStorage.getItem('cid'); if(!v){ v = rnd(); sessionStorage.setItem('cid', v); } return v; }catch{ return rnd(); } })();
const PT = `${NS}/p/${ME}`;                    // mi tema de presencia
const msgTopic = r => `${NS}/m/${r}`;          // tema de mensajes de una sala

let nick = '', current = null, hidden = false;
let client = null, bi = 0, failures = 0, everConnected = false;
const pres = new Map();   // id -> {n, r, h, ts, seen}  (otras personas conectadas)

const cleanNick = s => (s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,20);
const cleanRoom = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                        .replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
const hhmm = () => new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const color = n => { let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360} 70% 30%)`; };

/* ---------- Registro de mensajes ---------- */
function line(node){
  const log = $('log'), stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.appendChild(node);
  if(stick) log.scrollTop = log.scrollHeight;
}
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function sys(text){ const d=el('div','s'); d.append(el('span','t',`[${hhmm()}] `), `*** ${text}`); line(d); }
function chat(who, text, isMe){
  const d = el('div', isMe?'me':'');
  d.append(el('span','t',`[${hhmm()}] `));
  if(isMe){ d.append(`* ${who} ${text}`); }
  else { const n = el('b',null,`<${who}>`); n.style.color = color(who); d.append(n, ' ', text); }
  line(d);
}

/* ---------- Presencia, usuarios y salas ---------- */
function usersIn(room){ return [...pres.values()].filter(p => p.r === room); }
function roomCount(name){ return usersIn(name).filter(p => !p.h).length; }

function renderUsers(){
  const box = $('users'); box.replaceChildren();
  if(!current){ $('cnt').textContent = ''; return; }
  const names = [nick, ...usersIn(current).map(p => p.n)].sort((a,b)=>a.localeCompare(b,'es'));
  names.forEach(n=>{ const d=el('div',null,n); d.style.color=color(n); if(n===nick) d.style.fontWeight='bold'; $('users').append(d); });
  $('cnt').textContent = `${names.length} en la sala`;
}
function hint(inputId, hintId){
  const r = cleanRoom($(inputId).value), h = $(hintId);
  if(!r){ h.textContent = ''; return; }
  const n = roomCount(r) + (r === current && !hidden ? 1 : 0);
  h.textContent = n > 0
    ? `#${r} ya existe (${n} conectado${n>1?'s':''}). Entrarás a esa sala.`
    : `#${r} no aparece activa: se creará al entrar.`;
}
const updateHints = () => { hint('room0','exists'); hint('newroom','exists2'); };
function renderRooms(){
  const counts = new Map();
  for(const p of pres.values()) if(!p.h) counts.set(p.r,(counts.get(p.r)||0)+1);
  if(current && !hidden) counts.set(current,(counts.get(current)||0)+1);
  if(!counts.has('general')) counts.set('general',0);
  const sorted = [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  for(const [boxId, inLobby] of [['rooms',false],['rooms0',true]]){
    const box = $(boxId); box.replaceChildren();
    sorted.forEach(([r,n])=>{
      const d = el('div', !inLobby && r===current ? 'cur' : '', `#${r} (${n})`);
      d.title = `Entrar a #${r}`;
      d.onclick = () => inLobby ? ask(r, false) : enter(r);
      box.append(d);
    });
  }
  updateHints();
}
function notify(old, d){
  if(!current) return;
  const was = old && old.r === current, is = d && d.r === current;
  if(!was && is) sys(`${d.n} entró a la sala`);
  else if(was && !is) sys(`${old.n} salió de la sala`);
  else if(was && is && old.n !== d.n) sys(`${old.n} ahora es ${d.n}`);
}
function onPresence(id, buf){
  if(id === ME) return;
  const txt = buf.toString(), old = pres.get(id);
  let d = null;
  if(txt){ try{ d = JSON.parse(txt); }catch{} }
  if(d && (typeof d.ts !== 'number' || Date.now() - d.ts > TTL)) d = null;       // señal vieja: ignorar
  if(d){ d = { n: cleanNick(d.n) || 'anónimo', r: cleanRoom(d.r), h: !!d.h, ts: d.ts, seen: Date.now() }; if(!d.r) d = null; }
  d ? pres.set(id, d) : pres.delete(id);
  notify(old, d); renderUsers(); renderRooms();
}
function presence(){
  if(!client || !client.connected) return;
  client.publish(PT, current ? JSON.stringify({ n: nick, r: current, h: hidden ? 1 : 0, ts: Date.now() }) : '', { retain: true });
}
setInterval(presence, 25000);
setInterval(() => {                                   // quitar a quien dejó de dar señales
  let changed = false;
  for(const [id, p] of pres) if(Date.now() - p.seen > TTL){ pres.delete(id); notify(p, null); changed = true; }
  if(changed){ renderUsers(); renderRooms(); }
}, 15000);

/* ---------- Conexión al broker ---------- */
function setStatus(){
  const ok = client && client.connected;
  const t = ok ? 'Conectado al servidor. Los mensajes no se guardan.' : (everConnected ? 'Sin conexión, reconectando…' : 'Conectando al servidor…');
  $('st').textContent = t; $('lst').textContent = ok ? '' : t;
}
function connect(){
  if(!window.mqtt){ $('lst').textContent = 'No se pudo cargar la librería de conexión. Revisa tu internet.'; return; }
  const url = BROKERS[bi % BROKERS.length];
  client = window.mqtt.connect(url, {
    clientId: `cc-${ME}`, clean: true, keepalive: 30, connectTimeout: 8000, reconnectPeriod: 3000,
    will: { topic: PT, payload: '', retain: true, qos: 0 }
  });
  const mine = client;
  client.on('connect', () => {
    failures = 0; everConnected = true; setStatus();
    mine.subscribe(`${NS}/p/+`);
    if(current) mine.subscribe(msgTopic(current));
    presence();
  });
  client.on('close', () => {
    setStatus();
    if(!everConnected && ++failures >= 2 && BROKERS.length > 1){   // el servidor no responde: probar el siguiente
      mine.end(true); bi++; failures = 0; connect();
    }
  });
  client.on('message', (topic, buf) => {
    const parts = topic.split('/');
    if(parts[1] === 'p'){ onPresence(parts[2], buf); return; }
    if(parts[1] === 'm' && parts[2] === current){
      let d; try{ d = JSON.parse(buf.toString()); }catch{ return; }
      if(!d || d.c === ME) return;                                     // ignorar mis propios mensajes
      const text = String(d.t || '').slice(0, 500);
      if(text) chat(cleanNick(d.n) || 'anónimo', text, !!d.me);
    }
  });
}

/* ---------- Salas ---------- */
function enter(name){
  name = cleanRoom(name);
  if(!name){ sys('Nombre de sala no válido. Usa letras, números, - o _.'); return; }
  if(name === current) return;
  if(current && client) client.unsubscribe(msgTopic(current));
  $('log').replaceChildren();
  current = name; hidden = $('hidden').checked;
  history.replaceState(null,'','#'+name);
  $('topic').textContent = `#${name}`;
  $('who').textContent = nick;
  document.title = `#${name} · Chat Clásico`;
  $('side').classList.remove('open');
  if(client && client.connected) client.subscribe(msgTopic(name));
  const ex = usersIn(name).length;
  sys(ex > 0
    ? `Entraste a #${name}, una sala que ya existía (${ex} persona${ex>1?'s':''} conectada${ex>1?'s':''}).`
    : `Creaste #${name}. Comparte el nombre de la sala (o este enlace) para invitar a otros.`);
  setStatus(); presence(); renderUsers(); renderRooms();
  $('msg').focus();
}
function backToLobby(){
  if(current && client) client.unsubscribe(msgTopic(current));
  current = null; hidden = false; $('hidden').checked = false;
  presence();
  $('app').style.display = 'none'; $('login').style.display = '';
  $('who').textContent = ''; document.title = 'Chat Clásico';
  history.replaceState(null, '', location.pathname);
  renderRooms();
}

/* ---------- Envío y comandos ---------- */
function submit(text){
  text = text.trim(); if(!text) return;
  if(text[0] === '/'){
    const [cmd, ...rest] = text.slice(1).split(' '), arg = rest.join(' ').trim();
    switch(cmd.toLowerCase()){
      case 'nick': { const n = cleanNick(arg); if(!n) return sys('Uso: /nick NuevoAlias');
        const old = nick; nick = n; store.set('nick', n); $('who').textContent = n;
        sys(`Ahora eres ${n} (antes ${old})`); presence(); renderUsers(); return; }
      case 'me':   if(!arg) return sys('Uso: /me hace algo'); return send(arg, true);
      case 'join': case 'sala': return enter(arg);
      case 'lobby': return backToLobby();
      case 'ayuda': case 'help':
        sys('Comandos: /nick alias · /me acción · /join sala · /lobby · /ayuda'); return;
      default: return sys(`Comando desconocido: /${cmd}. Escribe /ayuda`);
    }
  }
  send(text, false);
}
function send(text, me){
  if(!client || !client.connected){ sys('Sin conexión con el servidor: el mensaje no se envió.'); return; }
  client.publish(msgTopic(current), JSON.stringify({ c: ME, n: nick, t: text, me: me ? 1 : 0 }));
  chat(nick, text, me);
}

/* ---------- Eventos ---------- */
let pending = null;
function ask(r, hide){
  pending = { r, hide };
  $('askroom').textContent = '#' + r;
  $('nick').value = nick || store.get('nick') || '';
  $('ask').style.display = 'flex';
  $('nick').focus(); $('nick').select();
}
function confirmNick(){
  const n = cleanNick($('nick').value);
  if(!n){ $('nick').focus(); return; }
  nick = n; store.set('nick', n);
  $('ask').style.display = 'none'; $('login').style.display = 'none'; $('app').style.display = 'flex';
  $('hidden').checked = pending.hide;
  const r = pending.r; pending = null;
  enter(r);
}
function create(){
  const r = cleanRoom($('room0').value);
  if(!r){ $('room0').focus(); return; }
  $('room0').value = '';
  ask(r, $('hidden0').checked);
}
$('enter').onclick = create;
$('room0').addEventListener('keydown', e => { if(e.key==='Enter') create(); });
$('askok').onclick = confirmNick;
$('askno').onclick = () => { pending = null; $('ask').style.display = 'none'; };
$('nick').addEventListener('keydown', e => { if(e.key==='Enter') confirmNick(); if(e.key==='Escape') $('askno').click(); });
$('back').onclick = backToLobby;
$('go').onclick = () => { const v = $('newroom').value; $('newroom').value=''; enter(v); };
$('newroom').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); $('go').click(); } });
$('hidden').onchange = () => { hidden = $('hidden').checked; presence(); renderRooms(); };
$('form').onsubmit = e => { e.preventDefault(); submit($('msg').value); $('msg').value=''; };
$('menu').onclick = () => $('side').classList.toggle('open');
window.addEventListener('hashchange', () => { const r = cleanRoom(location.hash.slice(1)); if(r && nick) enter(r); });
window.addEventListener('pagehide', () => { try{ if(client && client.connected) client.publish(PT, '', { retain: true }); }catch{} });
['room0','newroom'].forEach(id => $(id).addEventListener('input', updateHints));

// Inicio
const h0 = cleanRoom(location.hash.slice(1));
connect(); setStatus(); renderRooms();
if(h0) ask(h0, false);
</script>
</body>
</html>
